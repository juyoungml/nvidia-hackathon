name: Python quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked vulture poc scripts tests integrations submission evaluation --min-confidence 80
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/landing.js
      - run: node --check web/investigation.js
