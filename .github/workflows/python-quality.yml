name: Python quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format (ruff format --check)
        run: uv run --locked ruff format --check .

      - name: Dead code (vulture)
        run: uv run --locked vulture poc scripts tests integrations submission evaluation --min-confidence 80

      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax-check demo JavaScript
        run: |
          node --check web/app.js
          node --check web/landing.js
          node --check web/investigation.js
