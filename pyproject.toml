[project]
name = "plant-reliability-agent-poc"
version = "0.1.0"
description = "Public-data replay for the NVIDIA Korea Agentic AI Hackathon"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9",
    "vulture>=2.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
