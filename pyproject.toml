[project]
name = "plant-reliability-agent"
version = "0.1.0"
description = "Locally deployable NVIDIA Nemotron agent that runs the first investigation of a plant equipment report and returns evidence-linked next checks, replayed on public PreDist district-heating data."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Team Sona" }]
keywords = ["nvidia", "nemotron", "agent", "predictive-maintenance", "district-heating"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]
dependencies = []

[project.urls]
Homepage = "http://juyoung.site/nvidia-hackathon/"
Repository = "https://github.com/juyoungml/nvidia-hackathon"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "vulture>=2.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
